serenity {
    take.screenshots = FOR_EACH_ACTION
    use.unique.browser = false
    test.root = co.edu.udea.automationexercise.certificacion.moduloprueba
    console.colors = true
    report {
        accessibility = true
    }
    requirement {
        types = "epic, feature"
    }
}

#headless.mode = true

webdriver {
  driver = chrome
  autodownload = true
  # El sitio de práctica es lento y carga muchos anuncios: se espera hasta 20 s por cada elemento.
  wait.for.timeout = 20000
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
  }
}

# En una sola línea: si se parte en varias, Chrome recibe los switches con saltos de línea y los ignora.
# --host-resolver-rules bloquea los anuncios de Google (pantalla completa y enlaces que alteran el texto de los productos).
chrome.switches = "--start-maximized;--test-type;--no-sandbox;--ignore-certificate-errors;--disable-popup-blocking;--disable-default-apps;--disable-extensions-file-access-check;--incognito;--disable-infobars;--disable-gpu;--remote-allow-origins=*;--host-resolver-rules=MAP *.googlesyndication.com 127.0.0.1"

pages {
    automationUrl = "https://automationexercise.com/"
}